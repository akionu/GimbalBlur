# Origin definitions per serial port. Use yaw/pitch/roll in deg or counts.
# Optional: trig_mul=<float> scales the trigger pulse in data/ref_wxa.csv (default 1.05).
# Optional: <yaw|pitch|roll>_<pos_kp|spd_kp|spd_ki>=<float> overrides motor gains at runtime
#   (written with 0x15, not saved to flash). pitch_spd_kp=1.5 stops the ~124 Hz
#   pitch/yaw limit cycle that the saved 2.5 shows.
# Example: /dev/ttyGBL0 yaw_deg=179.2 pitch=4102 roll_deg=2.7 trig_mul=1.05
#
/dev/ttyGBL2 yaw_deg=165.28 pitch_deg=156.62 roll_deg=-37.35 trig_mul=1.0 pitch_spd_kp=1.5
/dev/ttyGBL1 yaw_deg=-175.83 pitch_deg=-179.38 roll_deg=-33.71 trig_mul=1.0 pitch_spd_kp=1.5
/dev/ttyGBL0 yaw_deg=75.87 pitch_deg=-54.78 roll_deg=-28.60 trig_mul=1.0 pitch_spd_kp=1.5
